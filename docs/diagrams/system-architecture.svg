<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">System Architecture — Enterprise ERP</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b">3-Tier Web Application · Clean Architecture · Single Page Application</text>

  <!-- ================= CLIENT ================= -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="300" height="470" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="60" y="120" width="300" height="54" rx="14" fill="url(#clientGrad)"/>
    <rect x="60" y="156" width="300" height="18" fill="url(#clientGrad)"/>
    <text x="210" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">CLIENT TIER</text>
    <text x="210" y="164" text-anchor="middle" font-size="12" fill="#bfdbfe">Angular 22 · SPA</text>
  </g>

  <g font-size="13" fill="#1e293b">
    <rect x="82" y="192" width="256" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="96" y="213" font-weight="600">Standalone Components</text>
    <text x="96" y="232" font-size="11.5" fill="#64748b">19 feature modules · signals state</text>

    <rect x="82" y="254" width="256" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="96" y="275" font-weight="600">Route Guards + Interceptors</text>
    <text x="96" y="294" font-size="11.5" fill="#64748b">JWT attach · 401 refresh · RBAC</text>

    <rect x="82" y="316" width="256" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="96" y="337" font-weight="600">Design System</text>
    <text x="96" y="356" font-size="11.5" fill="#64748b">Bootstrap 5 · Chart.js · dark mode</text>

    <rect x="82" y="378" width="256" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="96" y="399" font-weight="600">SignalR Client</text>
    <text x="96" y="418" font-size="11.5" fill="#64748b">Live notification stream</text>

    <rect x="82" y="440" width="256" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="96" y="461" font-weight="600">RxJS · Zoneless Rendering</text>
    <text x="96" y="480" font-size="11.5" fill="#64748b">Reactive HTTP + error handling</text>

    <rect x="82" y="502" width="256" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="96" y="524" font-weight="600">State</text>
    <text x="96" y="542" font-size="11.5" fill="#64748b">Signals + computed()</text>
    <text x="96" y="557" font-size="11.5" fill="#64748b">localStorage session</text>
  </g>

  <!-- ================= SERVER / API ================= -->
  <g filter="url(#shadow)">
    <rect x="450" y="120" width="300" height="470" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="450" y="120" width="300" height="54" rx="14" fill="url(#apiGrad)"/>
    <rect x="450" y="156" width="300" height="18" fill="url(#apiGrad)"/>
    <text x="600" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">APPLICATION TIER</text>
    <text x="600" y="164" text-anchor="middle" font-size="12" fill="#ddd6fe">ASP.NET Core 9 Web API</text>
  </g>

  <g font-size="13" fill="#1e293b">
    <rect x="472" y="192" width="256" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="486" y="213" font-weight="600">ERP.API · Controllers</text>
    <text x="486" y="232" font-size="11.5" fill="#64748b">165 endpoints · Swagger/JWT</text>

    <rect x="472" y="254" width="256" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="486" y="275" font-weight="600">ERP.Application</text>
    <text x="486" y="294" font-size="11.5" fill="#64748b">Interfaces · DTOs · contracts</text>

    <rect x="472" y="316" width="256" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="486" y="337" font-weight="600">ERP.Domain</text>
    <text x="486" y="356" font-size="11.5" fill="#64748b">31 entities · business rules</text>

    <rect x="472" y="378" width="256" height="60" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="486" y="399" font-weight="600">ERP.Infrastructure</text>
    <text x="486" y="418" font-size="11.5" fill="#64748b">EF Core · 10 services ·</text>
    <text x="486" y="433" font-size="11.5" fill="#64748b">Seeders · NotificationHub</text>

    <rect x="472" y="448" width="256" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="486" y="469" font-weight="600">Security Pipeline</text>
    <text x="486" y="488" font-size="11.5" fill="#64748b">JWT + refresh rotation · RBAC</text>

    <rect x="472" y="510" width="256" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="486" y="531" font-weight="600">Cross-Cutting</text>
    <text x="486" y="550" font-size="11.5" fill="#64748b">Audit log · CORS · Swagger</text>
  </g>

  <!-- ================= DATA ================= -->
  <g filter="url(#shadow)">
    <rect x="840" y="120" width="300" height="470" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="840" y="120" width="300" height="54" rx="14" fill="url(#dbGrad)"/>
    <rect x="840" y="156" width="300" height="18" fill="url(#dbGrad)"/>
    <text x="990" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">DATA TIER</text>
    <text x="990" y="164" text-anchor="middle" font-size="12" fill="#cffafe">SQL Server 2022</text>
  </g>

  <g font-size="13" fill="#1e293b">
    <rect x="862" y="192" width="256" height="52" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="876" y="213" font-weight="600">Entity Framework Core</text>
    <text x="876" y="232" font-size="11.5" fill="#64748b">Code-First · Unit of Work</text>

    <rect x="862" y="254" width="256" height="52" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="876" y="275" font-weight="600">4 Migrations</text>
    <text x="876" y="294" font-size="11.5" fill="#64748b">Schema versioned in repo</text>

    <rect x="862" y="316" width="256" height="52" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="876" y="337" font-weight="600">31 Tables</text>
    <text x="876" y="356" font-size="11.5" fill="#64748b">Soft-delete · audit columns</text>

    <rect x="862" y="378" width="256" height="52" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="876" y="399" font-weight="600">Seed Data</text>
    <text x="876" y="418" font-size="11.5" fill="#64748b">Roles · users · templates</text>

    <rect x="862" y="440" width="256" height="52" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="876" y="461" font-weight="600">Indexed Queries</text>
    <text x="876" y="480" font-size="11.5" fill="#64748b">Filtered · paginated</text>

    <rect x="862" y="502" width="256" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="876" y="524" font-weight="600">Database</text>
    <text x="876" y="542" font-size="11.5" fill="#64748b">ERPDB (localhost)</text>
    <text x="876" y="557" font-size="11.5" fill="#64748b">Windows Auth / SQL Auth</text>
  </g>

  <!-- ================= ARROWS ================= -->
  <!-- Client -> API -->
  <line x1="360" y1="250" x2="448" y2="250" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="448" y1="290" x2="362" y2="290" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="404" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">HTTPS · REST/JSON</text>
  <text x="404" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">JWT Bearer</text>

  <!-- API -> DB -->
  <line x1="750" y1="250" x2="838" y2="250" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="838" y1="290" x2="752" y2="290" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="794" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">EF Core</text>
  <text x="794" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">TDS / SQL</text>

  <!-- ================= BOTTOM STRIP ================= -->
  <g font-size="13">
    <rect x="60" y="626" width="1080" height="100" rx="14" fill="#0f172a"/>
    <text x="90" y="658" font-size="14" font-weight="700" fill="#ffffff">Platform Services</text>

    <g transform="translate(90,672)">
      <rect width="240" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="120" y="25" text-anchor="middle" font-size="12.5" fill="#e2e8f0">SignalR — real-time notifications</text>
    </g>
    <g transform="translate(350,672)">
      <rect width="240" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="120" y="25" text-anchor="middle" font-size="12.5" fill="#e2e8f0">JWT + Refresh Rotation — auth</text>
    </g>
    <g transform="translate(610,672)">
      <rect width="230" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="115" y="25" text-anchor="middle" font-size="12.5" fill="#e2e8f0">Swagger UI — API docs</text>
    </g>
    <g transform="translate(860,672)">
      <rect width="250" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="125" y="25" text-anchor="middle" font-size="12.5" fill="#e2e8f0">Audit Logging + Role-based access</text>
    </g>
  </g>
</svg>
