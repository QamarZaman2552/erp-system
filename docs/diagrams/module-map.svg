      <rect width="252" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh3)"/>
      <text x="126" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">19</text>
      <text x="126" y="54" text-anchor="middle" font-size="12" fill="#64748b">Frontend Modules</text>
    </g>
    <g transform="translate(336,96)">
      <rect width="252" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh3)"/>
      <text x="126" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3aed">165</text>
      <text x="126" y="54" text-anchor="middle" font-size="12" fill="#64748b">REST Endpoints</text>
    </g>
    <g transform="translate(612,96)">
