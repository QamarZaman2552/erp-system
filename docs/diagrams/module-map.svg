  <rect width="1200" height="820" fill="url(#bg3)"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Enterprise ERP — Module Map</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b">19 feature modules · 165 API endpoints · 31 database entities · 4 user roles</text>

  <!-- stats row -->
  <g font-size="13">
