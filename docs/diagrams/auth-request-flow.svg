<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg2)"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Authentication &amp; Request Lifecycle</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b">JWT access token + single-use rotating refresh token with race-safe single-flight refresh</text>

  <!-- Step 1 Login -->
  <g filter="url(#sh2)">
    <rect x="50" y="120" width="250" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="50" y="120" width="250" height="40" rx="12" fill="#2563eb"/>
    <rect x="50" y="146" width="250" height="14" fill="#2563eb"/>
    <text x="175" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1 · LOGIN</text>
  </g>
  <text x="68" y="184" font-size="12.5" fill="#1e293b">POST /api/auth/login</text>
  <text x="68" y="204" font-size="12" fill="#64748b">email + password verified</text>
  <text x="68" y="224" font-size="12" fill="#64748b">→ access token (1 h)</text>
  <text x="68" y="242" font-size="12" fill="#64748b">→ refresh token (single-use)</text>

  <!-- Step 2 Store -->
  <g filter="url(#sh2)">
    <rect x="340" y="120" width="250" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="340" y="120" width="250" height="40" rx="12" fill="#7c3aed"/>
    <rect x="340" y="146" width="250" height="14" fill="#7c3aed"/>
    <text x="465" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2 · CLIENT SESSION</text>
  </g>
  <text x="358" y="184" font-size="12.5" fill="#1e293b">Tokens stored (localStorage)</text>
  <text x="358" y="204" font-size="12" fill="#64748b">signal-driven auth state</text>
  <text x="358" y="224" font-size="12" fill="#64748b">authGuard checks token presence</text>
  <text x="358" y="242" font-size="12" fill="#64748b">roleGuard enforces RBAC</text>

  <!-- Step 3 Authenticated request -->
  <g filter="url(#sh2)">
    <rect x="630" y="120" width="250" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="630" y="120" width="250" height="40" rx="12" fill="#0891b2"/>
    <rect x="630" y="146" width="250" height="14" fill="#0891b2"/>
    <text x="755" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3 · AUTHENTICATED CALL</text>
  </g>
  <text x="648" y="184" font-size="12.5" fill="#1e293b">jwtInterceptor attaches</text>
  <text x="648" y="204" font-size="12" fill="#64748b">Authorization: Bearer &lt;jwt&gt;</text>
  <text x="648" y="224" font-size="12" fill="#64748b">error.interceptor maps failures</text>
  <text x="648" y="242" font-size="12" fill="#64748b">to toast + audit trail</text>

  <!-- Step 4 API pipeline -->
  <g filter="url(#sh2)">
    <rect x="920" y="120" width="230" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="920" y="120" width="230" height="40" rx="12" fill="#0f172a"/>
    <rect x="920" y="146" width="230" height="14" fill="#0f172a"/>
    <text x="1035" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4 · API PIPELINE</text>
  </g>
  <text x="938" y="184" font-size="12.5" fill="#1e293b">JWT middleware validates</text>
  <text x="938" y="204" font-size="12" fill="#64748b">role policy authorization</text>
  <text x="938" y="224" font-size="12" fill="#64748b">Controller → Service → EF Core</text>
  <text x="938" y="242" font-size="12" fill="#64748b">audit log written</text>

  <!-- Arrows row 1 -->
  <line x1="300" y1="185" x2="338" y2="185" stroke="#475569" stroke-width="2.2" marker-end="url(#arr2)"/>
  <line x1="590" y1="185" x2="628" y2="185" stroke="#475569" stroke-width="2.2" marker-end="url(#arr2)"/>
  <line x1="880" y1="185" x2="918" y2="185" stroke="#475569" stroke-width="2.2" marker-end="url(#arr2)"/>

  <!-- ============ 401 / REFRESH FLOW (lower half) ============ -->
  <rect x="50" y="300" width="1100" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="50" y="300" width="1100" height="46" rx="14" fill="#dc2626"/>
  <rect x="50" y="332" width="1100" height="14" fill="#dc2626"/>
  <text x="600" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TOKEN EXPIRY — 401 RECOVERY FLOW (single-flight refresh)</text>

  <!-- 5 -->
  <g filter="url(#sh2)">
    <rect x="80" y="372" width="230" height="120" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="96" y="396" font-size="13.5" font-weight="700" fill="#b91c1c">5 · 401 RECEIVED</text>
    <text x="96" y="418" font-size="12" fill="#1e293b">Access token expired</text>
    <text x="96" y="438" font-size="12" fill="#64748b">N parallel requests may fail</text>
    <text x="96" y="458" font-size="12" fill="#64748b">at the same instant</text>
    <text x="96" y="478" font-size="12" fill="#64748b">(dashboard fires ~14 calls)</text>
  </g>

  <!-- 6 -->
  <g filter="url(#sh2)">
    <rect x="340" y="372" width="230" height="120" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="356" y="396" font-size="13.5" font-weight="700" fill="#6d28d9">6 · SINGLE-FLIGHT GUARD</text>
    <text x="356" y="418" font-size="12" fill="#1e293b">First caller starts refresh</text>
    <text x="356" y="438" font-size="12" fill="#64748b">others reuse the same</text>
    <text x="356" y="458" font-size="12" fill="#64748b">in-flight observable</text>
    <text x="356" y="478" font-size="12" fill="#64748b">→ exactly 1 network call</text>
  </g>

  <!-- 7 -->
  <g filter="url(#sh2)">
    <rect x="600" y="372" width="230" height="120" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="616" y="396" font-size="13.5" font-weight="700" fill="#0e7490">7 · TOKEN ROTATION</text>
    <text x="616" y="418" font-size="12" fill="#1e293b">POST /auth/refresh-token</text>
    <text x="616" y="438" font-size="12" fill="#64748b">old refresh token consumed</text>
    <text x="616" y="458" font-size="12" fill="#64748b">new pair returned &amp; stored</text>
    <text x="616" y="478" font-size="12" fill="#64748b">rotation defeats replay</text>
  </g>

  <!-- 8 -->
  <g filter="url(#sh2)">
    <rect x="860" y="372" width="260" height="120" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="876" y="396" font-size="13.5" font-weight="700" fill="#15803d">8 · RETRY + RESUME</text>
    <text x="876" y="418" font-size="12" fill="#1e293b">Original requests retried once</text>
    <text x="876" y="438" font-size="12" fill="#64748b">with the fresh access token</text>
    <text x="876" y="458" font-size="12" fill="#64748b">user never sees a logout</text>
    <text x="876" y="478" font-size="12" fill="#64748b">only logout on refresh failure</text>
  </g>

  <line x1="310" y1="432" x2="338" y2="432" stroke="#475569" stroke-width="2.2" marker-end="url(#arr2)"/>
  <line x1="570" y1="432" x2="598" y2="432" stroke="#475569" stroke-width="2.2" marker-end="url(#arr2)"/>
  <line x1="830" y1="432" x2="858" y2="432" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrG)"/>

  <!-- bottom note -->
  <text x="600" y="540" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Why it matters</text>
  <text x="600" y="566" text-anchor="middle" font-size="12.5" fill="#64748b">Refresh tokens are single-use server-side. Without single-flight coordination, N concurrent 401s would send the same token N times —</text>
  <text x="600" y="588" text-anchor="middle" font-size="12.5" fill="#64748b">N-1 attempts fail, catchError triggers logout(), and the user is randomly signed out mid-session. The share() guard makes exactly one call.</text>

  <text x="600" y="628" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Verified: 12 simultaneous 401s → 1 refresh request → session preserved ✓</text>
</svg>
